# Infraestructura del backend en Render (Blueprint).
# Crear con: Render Dashboard -> New -> Blueprint -> apuntar a este repo.
#
# La base de datos NO está aquí: vive en Neon. Se conecta con DATABASE_URL,
# que se carga a mano en el dashboard por ser un secreto (sync: false).
services:
  - type: web
    name: goldforall-api
    runtime: node
    plan: free
    region: oregon
    branch: main
    rootDir: .

    # Render detecta pnpm por el pnpm-lock.yaml y el campo packageManager
    # del package.json de la raíz.
    buildCommand: pnpm install --frozen-lockfile
    startCommand: pnpm --filter goldforall-server start

    # Si /api/health deja de responder 200, Render reinicia el servicio.
    healthCheckPath: /api/health

    envVars:
      - key: NODE_VERSION
        value: "22"

      - key: NODE_ENV
        value: production

      # --- Secretos: se cargan a mano en el dashboard de Render ---
      # DATABASE_URL: la cadena de conexión de Neon (incluye sslmode=require)
      - key: DATABASE_URL
        sync: false
      # JWT_SECRET: generar con "pnpm secret". DEBE ser distinto al de desarrollo.
      - key: JWT_SECRET
        sync: false

      # --- URLs públicas: OBLIGATORIAS, el servicio no arranca sin ellas ---
      # Con el rewrite de Vercel, el navegador ve la API en el MISMO dominio
      # que la SPA, así que las dos llevan el dominio de Vercel (no el de
      # Render). De ahí sale también el redirect_uri de Google.
      # Por eso hay que desplegar Vercel ANTES que esto: ver DEPLOY.md.
      - key: APP_URL
        sync: false
      - key: API_URL
        sync: false
      # Opcional: si se omite, se permite exactamente el origen de APP_URL.
      # Solo hace falta declararlo si hay más de un dominio de frontend.
      - key: CORS_ORIGINS
        sync: false

      # Saltos de proxy medidos EN PRODUCCIÓN con GET /api/admin/diagnostico:
      #   cliente -> Vercel (rewrite) -> Cloudflare de Render -> LB interno
      # X-Forwarded-For trae 4 entradas; con 4 la IP detectada es la real.
      # Nota asumida: quien pegue directo a *.onrender.com (sin pasar por
      # Vercel) puede falsear su IP en el rate limit; el bloqueo de cuenta
      # por correo cubre la fuerza bruta también en ese camino.
      - key: TRUST_PROXY
        value: "4"

      - key: COOKIE_SECURE
        value: "true"

      - key: QUOTA_TIMEZONE
        value: America/Bogota

      - key: ACCESS_TOKEN_TTL
        value: 15m
      - key: REFRESH_TOKEN_TTL_DAYS
        value: "30"
      - key: BCRYPT_ROUNDS
        value: "12"

      # Correos que quedan como admin al correr las migraciones.
      - key: ADMIN_EMAILS
        sync: false

      # Registro público cerrado: las cuentas las crea un administrador desde
      # el panel. Cierra también el alta automática por Google, que si no
      # sería la puerta de atrás evidente.
      - key: ALLOW_PUBLIC_REGISTRATION
        value: "false"

      # Autosuscripción Premium (pago simulado) cerrada: Premium lo gestiona
      # el administrador con duración o fecha de caducidad.
      - key: ALLOW_SELF_SUBSCRIBE
        value: "false"

      # --- Opcionales: dejar vacíos desactiva la funcionalidad ---
      # Google OAuth. El URI de redirección autorizado debe ser
      # https://TU-DOMINIO-VERCEL/api/auth/google/callback
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: GOOGLE_CLIENT_SECRET
        sync: false

      # SMTP. Sin SMTP_HOST el enlace de recuperación solo se imprime en el
      # log de Render, que no le sirve a un usuario real.
      - key: SMTP_HOST
        sync: false
      - key: SMTP_PORT
        value: "587"
      - key: SMTP_USER
        sync: false
      - key: SMTP_PASSWORD
        sync: false
      - key: SMTP_FROM
        sync: false
